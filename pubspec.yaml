name: humanbeans_clock
description: Humanbeans Flutter Clock Challenge Submission
publish_to: none

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# In Android, build-name is used as versionName while build-number used as versionCode.
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
version: 1.1.1

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

  # Plays the .flr bird and halo animations. Upstream (2d-inc/Flare-Flutter) is
  # unmaintained and no longer compiles against current Flutter, so a patched
  # copy lives in packages/flare_flutter (MIT, see its LICENSE).
  flare_flutter:
    path: packages/flare_flutter

  intl: ^0.20.2

  # Persists the next "bird visit" timestamp. Works on Android, iOS, Linux and
  # web (the old path_provider/dart:io approach could not run on web).
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# The following section is specific to Flutter.
flutter:
  # Include the Material Icons font.
  uses-material-design: true

  assets:
    - assets/rive/Bird_Final_2.flr
    - assets/rive/Light_Final.flr

    - assets/images/Pngs_Flat_0003_Bird_Shine_Color_Dodge.png
    - assets/images/Pngs_Flat_0001_Texture_Screen.png
    - assets/images/Pngs_Flat_0002_Texture_Multiply.png

    - assets/images/Pngs_Flat_0007_F_B_Left.png
    - assets/images/Pngs_Flat_0008_F_B_Left_2.png
    - assets/images/Pngs_Flat_0004_F_Leaf_L_1.png
    - assets/images/Pngs_Flat_0005_F_Leaf_L_2.png
    - assets/images/Pngs_Flat_0006_F_Leaf_L_3.png

    - assets/images/Pngs_Flat_0033_B_Br_Left.png
    - assets/images/Pngs_Flat_0034_B_Br_Left_1.png
    - assets/images/Pngs_Flat_0032_B_Leaf_L_1.png
    - assets/images/Pngs_Flat_0031_B_Leaf_L_2.png
    - assets/images/Pngs_Flat_0030_B_Leaf_L_3.png
    - assets/images/Pngs_Flat_0029_B_leaf_L_4.png
    - assets/images/Pngs_Flat_0028_B_Leaf_L_5.png
    - assets/images/Pngs_Flat_0027_B_Leaf_L_6.png

    - assets/images/Pngs_Flat_0014_F_B_Right.png
    - assets/images/Pngs_Flat_0015_F_B_Right_2.png
    - assets/images/Pngs_Flat_0013_F_Leaf_R_5.png
    - assets/images/Pngs_Flat_0012_F_Leaf_R_4.png
    - assets/images/Pngs_Flat_0011_F_Leaf_R_3.png
    - assets/images/Pngs_Flat_0010_F_Leaf_R_2.png
    - assets/images/Pngs_Flat_0009_F_Leaf_R_1.png

    - assets/images/Pngs_Flat_0035_B_Br_right.png
    - assets/images/Pngs_Flat_0036_B_Br_Right_1.png
    - assets/images/Pngs_Flat_0037_B_Br_right_2.png
    - assets/images/Pngs_Flat_0022_B_Leaf_R_5.png
    - assets/images/Pngs_Flat_0023_B_Leaf_R_4.png
    - assets/images/Pngs_Flat_0024_B_Leaf_R_3.png
    - assets/images/Pngs_Flat_0025_B_Leaf_R_2.png
    - assets/images/Pngs_Flat_0026_B_Leaf_R_1.png

    - assets/images/Loading_Screen.png
    - assets/images/Dots.png

  fonts:
    - family: HumanBeansBird
      fonts:
        - asset: assets/fonts/Bird_font.ttf

# `dart run flutter_launcher_icons` regenerates the platform launcher icons.
flutter_launcher_icons:
  image_path: "assets/images/icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: "assets/images/icon.png"
  web:
    generate: true
    image_path: "assets/images/icon.png"
